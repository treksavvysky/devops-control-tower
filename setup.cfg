[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .git,__pycache__,build,dist,.venv,.eggs,migrations
# pytest fixtures imported from another test module are "redefined" as test
# arguments by design (shared SQLite/PostgreSQL backend fixture)
per-file-ignores =
    tests/test_lifecycle_atomicity.py: F811
