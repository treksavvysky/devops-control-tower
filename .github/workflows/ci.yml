name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Lint and test are separate jobs so test results are visible even while
  # lint fails (DEVOPS-CON-4). Neither is a required check on main.
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit

    - name: Run pre-commit (black, isort, flake8 at pinned versions)
      run: pre-commit run --all-files --show-diff-on-failure --color always

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_devops_control_tower
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('constraints/ci-py312.txt', 'requirements-dev.txt', 'pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies (pinned by constraints/ci-py312.txt)
      run: |
        python -m pip install --upgrade pip
        pip install -c constraints/ci-py312.txt -r requirements-dev.txt
        pip install -c constraints/ci-py312.txt -e .

    - name: Show key versions
      run: pip list 2>/dev/null | grep -iE '^(pydantic|pydantic.core|sqlalchemy|mcp|fastapi|starlette|httpx|alembic|psycopg2-binary) '

    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_devops_control_tower
        REDIS_URL: redis://localhost:6379/0
      run: |
        coverage run -m pytest -o addopts="-ra --strict-markers --strict-config"
        coverage report --skip-covered | tail -1
        coverage xml

    - name: Verify fresh DB migrations (SQLite)
      if: always()
      run: bash scripts/verify_db_fresh.sh

    - name: Verify fresh DB migrations (PostgreSQL)
      if: always()
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_fresh_migration
      run: |
        PGPASSWORD=postgres createdb -h localhost -U postgres test_fresh_migration
        alembic upgrade head
        alembic downgrade -1
        alembic upgrade head
        PGPASSWORD=postgres dropdb -h localhost -U postgres test_fresh_migration

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # Builds the Docker image on pushes to main to prove the Dockerfile works.
  # It does NOT publish: nothing consumes a JCT image (George, 2026-11-25,
  # DEVOPS-CON-4). To publish to GHCR later, add a GHCR login step, set
  # `push: true`, and grant `packages: write`.
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build Docker image (not pushed)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          bandit -r devops_control_tower -f json -o bandit-report.json --exit-zero

      - name: Upload Bandit scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-results
          path: bandit-report.json

      - name: Run Safety dependency scan
        run: |
          safety check --output json > safety-report.json || true

      - name: Upload Safety scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-results
          path: safety-report.json
